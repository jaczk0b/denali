[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "denali"
description = "Panel do homelaba: co padło, dlaczego i gdzie szukać."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "argon2-cffi>=25.1",
    "cryptography>=45",
    "httpx>=0.28",
    "segno>=1.6",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["weasyprint>=66"]          # PDF eksportu; wymaga bibliotek pango (są w obrazie Dockera)

[tool.setuptools.dynamic]
version = { attr = "denali.__version__" }

[tool.setuptools.packages.find]
include = ["denali*"]

[tool.setuptools.package-data]
denali = ["migrations/script.py.mako", "templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
