{% extends "base.html" %}
{% from "_makra.html" import alerts %}
{% block title %}Potwierdź{% endblock %}
{% block content %}
<form class="card narrow" method="post" action="/potwierdz">
  <h1>Potwierdź, że to Ty</h1>
  <p class="muted">Pokazanie hasła ze skarbca wymaga ponownego potwierdzenia. Ważne przez 5 minut.</p>
  {{ alerts(error) }}
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="field">Hasło<input name="password" type="password" autocomplete="current-password" required autofocus></label>
  {% if sess.totp_ct %}
  <label class="field">Kod z aplikacji (albo zapasowy)<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
  {% endif %}
  <button class="btn primary wide" type="submit">Potwierdź</button>
</form>
{% endblock %}
