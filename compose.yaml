# HTTPS robi istniejący Nginx Proxy Manager w LAN (proxy host denali.serwispowers.com → IP-tej-VM:8000).
# Panelu NIE dodajemy do Pangolina/Newt ani do tunelu Cloudflare — dostęp tylko z LAN i Tailscale.
#
# DENALI_DATA_PATH: katalog na hoście z bazą, plikami i kopiami. W Komodo ustaw stałą ścieżkę (np. /opt/denali/data),
# bo katalog z klonem repozytorium Komodo może wyczyścić przy aktualizacji. Właściciela (UID 1000) ustawia sam
# krótki krok „data-owner” przed startem panelu — ręczny chown nie jest potrzebny.
x-data: &data
  - ${DENALI_DATA_PATH:-./data}:/data

x-denali: &denali
  image: denali:local     # budowany lokalnie z Dockerfile, nie ma go w żadnym rejestrze
  pull_policy: never      # worker używa obrazu zbudowanego dla app — nigdy nie pobieraj z Docker Hub
  restart: unless-stopped
  env_file:
    - path: .env          # DENALI_ENCRYPTION_KEY, DENALI_TRUSTED_PROXIES, DENALI_BASE_URL (w Komodo: Environment)
      required: false
  environment:
    DENALI_DATA_DIR: /data
  volumes: *data

services:
  # Jednorazowo przy każdym wdrożeniu: katalog danych należy do użytkownika panelu (UID 1000).
  # Docker tworzy brakujący katalog na hoście jako root — bez tego panel nie zapisze bazy.
  data-owner:
    image: denali:local
    pull_policy: never
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes: *data
    restart: "no"

  app:
    <<: *denali
    build: .
    pull_policy: build    # przy każdym wdrożeniu buduj z bieżącego kodu (nowa wersja z repo = nowy obraz)
    command: sh -c "python -m denali migrate && python -m denali serve --host 0.0.0.0 --port 8000"
    ports:
      - "${DENALI_PORT:-8000}:8000"
    depends_on:
      data-owner:
        condition: service_completed_successfully

  worker:
    <<: *denali
    command: python -m denali worker
    depends_on:
      app:
        condition: service_healthy
